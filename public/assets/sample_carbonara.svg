<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#faf4eb"/><stop offset="100%" stop-color="#d8c19d"/></radialGradient>
    <radialGradient id="plate" cx="50%" cy="50%" r="50%"><stop offset="60%" stop-color="#fffdf9"/><stop offset="90%" stop-color="#eae0cb"/><stop offset="100%" stop-color="#bead93"/></radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg3)"/>
  <!-- Rimmed ceramic bowl -->
  <circle cx="200" cy="145" r="120" fill="url(#plate)" stroke="#91795c" stroke-width="2"/>
  <circle cx="200" cy="145" r="85" fill="#f5eedb" stroke="#bda889" stroke-width="1.5"/>
  <!-- Pasta nest with glossy golden sauce -->
  <g transform="translate(200, 145)">
    <ellipse cx="0" cy="0" rx="75" ry="65" fill="#fce595" stroke="#d4a840" stroke-width="2"/>
    <!-- Spaghetti swirls -->
    <path d="M-50 -25 Q0 -60 50 -20 Q70 15 35 45 Q-20 60 -50 25 Q-70 -5 -25 -25 Q30 -40 40 10" fill="none" stroke="#e5a328" stroke-width="5" stroke-linecap="round"/>
    <path d="M-40 20 Q-10 -30 30 -15 Q60 10 10 35 Q-30 45 -45 5" fill="none" stroke="#ffc94b" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M-25 -40 Q25 -45 45 -5 Q20 30 -20 15" fill="none" stroke="#fabf36" stroke-width="4" stroke-linecap="round"/>
    <!-- Guanciale crispy cubes -->
    <rect x="-40" y="-15" width="15" height="12" rx="2" fill="#7a2818" stroke="#451309" stroke-width="1.5"/>
    <rect x="10" y="-35" width="16" height="13" rx="2" fill="#8a2c1a" stroke="#451309" stroke-width="1.5"/>
    <rect x="25" y="15" width="18" height="14" rx="2" fill="#752314" stroke="#451309" stroke-width="1.5"/>
    <rect x="-25" y="25" width="16" height="12" rx="2" fill="#8a2c1a" stroke="#451309" stroke-width="1.5"/>
    <rect x="-10" y="-5" width="14" height="12" rx="2" fill="#6b1e10" stroke="#451309" stroke-width="1.5"/>
    <!-- Cracked black pepper flecks -->
    <circle cx="-30" cy="-35" r="2" fill="#1e140e"/>
    <circle cx="-15" cy="-20" r="2.5" fill="#1e140e"/>
    <circle cx="5" cy="-15" r="2" fill="#1e140e"/>
    <circle cx="-5" cy="15" r="2.5" fill="#1e140e"/>
    <circle cx="20" cy="-5" r="1.8" fill="#1e140e"/>
    <circle cx="45" cy="-10" r="2.2" fill="#1e140e"/>
    <circle cx="-45" cy="10" r="2" fill="#1e140e"/>
    <circle cx="15" cy="40" r="2.2" fill="#1e140e"/>
  </g>
  <text x="200" y="275" font-family="'Georgia', serif" font-size="13" fill="#6b4929" text-anchor="middle" letter-spacing="1">LA CUCINA ROMANA TRADIZIONALE</text>
</svg>