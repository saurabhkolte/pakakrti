    <path d="M-65 -45 Q-15 -60 10 -25 Q20 5 -20 15 Q-70 10 -65 -45 Z" fill="#c98934" stroke="#784712" stroke-width="2"/>
    <path d="M-20 -5 Q30 -20 55 15 Q40 55 -5 45 Q-40 35 -20 -5 Z" fill="#d4933d" stroke="#784712" stroke-width="2"/>
    <!-- Sear marks -->
    <line x1="-50" y1="-40" x2="-20" y2="-20" stroke="#542e07" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-35" y1="-45" x2="-5" y2="-25" stroke="#542e07" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="30" y2="20" stroke="#542e07" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="15" y1="-5" x2="45" y2="15" stroke="#542e07" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Spinach leaves -->
    <path d="M-70 15 Q-55 35 -40 20 Q-55 5 -70 15 Z" fill="#2d571e" stroke="#19360d" stroke-width="1.5"/>
    <path d="M-10 -55 Q10 -65 15 -45 Q-5 -35 -10 -55 Z" fill="#366624" stroke="#19360d" stroke-width="1.5"/>
    <path d="M35 -35 Q60 -25 50 -5 Q25 -15 35 -35 Z" fill="#2d571e" stroke="#19360d" stroke-width="1.5"/>
    <path d="M-60 -15 Q-45 -5 -35 -20 Q-50 -30 -60 -15 Z" fill="#366624" stroke="#19360d" stroke-width="1.5"/>
    <!-- Sun-dried tomato slices -->
    <path d="M-55 40 Q-30 45 -40 60 Q-65 55 -55 40 Z" fill="#9e261b" stroke="#5e120b" stroke-width="1.5"/>
    <path d="M15 45 Q40 50 30 65 Q5 60 15 45 Z" fill="#a8291c" stroke="#5e120b" stroke-width="1.5"/>
    <path d="M-15 25 Q5 30 -5 45 Q-25 40 -15 25 Z" fill="#942318" stroke="#5e120b" stroke-width="1.5"/>
    <path d="M50 0 Q65 15 50 25 Q35 10 50 0 Z" fill="#ab2b1e" stroke="#5e120b" stroke-width="1.5"/>
  </g>
  <text x="200" y="275" font-family="'Georgia', serif" font-size="13" fill="#593817" text-anchor="middle" letter-spacing="1">TRATTORIA TOSCANA RUSTICA</text>
