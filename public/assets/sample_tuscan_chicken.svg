    <radialGradient id="skillet" cx="40%" cy="40%" r="60%"><stop offset="0%" stop-color="#424242"/><stop offset="80%" stop-color="#212121"/><stop offset="100%" stop-color="#111111"/></radialGradient>
    <radialGradient id="sauce" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff6dc"/><stop offset="80%" stop-color="#f2d596"/><stop offset="100%" stop-color="#d1a654"/></radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg5)"/>
  <!-- Cast Iron Skillet -->
  <g transform="translate(200, 145)">
    <path d="M110 0 L170 0" stroke="#1f1f1f" stroke-width="16" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="115" fill="url(#skillet)" stroke="#0a0a0a" stroke-width="3"/>
    <circle cx="0" cy="0" r="98" fill="url(#sauce)"/>
